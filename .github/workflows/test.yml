name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env
      - name: Start database and backend
        run: |
          docker compose up -d db redis backend
          for i in $(seq 1 60); do
            if docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')" 2>/dev/null; then
              echo "Backend healthy"
              break
            fi
            sleep 5
          done
      - name: Pytest
        run: docker compose exec -T -e PIXELCAST_SIGNAGE_INSTALLED=true backend python -m pytest tests/ -q --tb=no

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  frontend-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env
      - name: Start stack
        run: docker compose up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4173/api/health/; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4173
          E2E_USERNAME: admin@pixelcast.com
          E2E_PASSWORD: adminadmin
        run: |
          npm ci
          npx playwright install chromium
          npm run e2e -- --workers=1
