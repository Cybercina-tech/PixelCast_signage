    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
    <script>
      // Prevent theme flash by setting theme before Vue loads
      (function() {
        function normalizePreference(raw) {
          if (!raw) return null;
          if (raw === 'dark' || raw === 'light' || raw === 'system') return raw;
          try {
            const parsed = JSON.parse(raw);
            if (parsed && (parsed.preference === 'dark' || parsed.preference === 'light' || parsed.preference === 'system')) {
              return parsed.preference;
            }
          } catch (_) {
            // no-op
          }
          return null;
        }

        const storedValue = localStorage.getItem('pixelcast-signage_theme');
        const preference = normalizePreference(storedValue) || 'system';
        const resolvedTheme = preference === 'system'
          ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light')
          : preference;

        if (resolvedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
